<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Highlight</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      .frame {
        position: fixed;
        inset: 0;
        box-sizing: border-box;
        border: 3px solid #e81123;
        /* Viền trắng mảnh bên trong để còn thấy được trên nền đỏ */
        outline: 1px solid rgba(255, 255, 255, 0.85);
        outline-offset: -4px;
      }
    </style>
  </head>
  <body>
    <div class="frame"></div>
  </body>
</html>
