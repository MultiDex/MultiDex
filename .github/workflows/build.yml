name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run tauri build -- --bundles nsis

      - uses: actions/upload-artifact@v7
        with:
          name: WinDex${{ github.sha }}
          path: |
            src-tauri/target/release/windex.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  release:
    needs: windows
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: WinDex${{ github.sha }}
          path: out

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mv out/windex.exe "out/WinDex_${version}_x64-portable.exe"
          gh release create "v${version}-build.${{ github.run_number }}" \
            "out/WinDex_${version}_x64-portable.exe" out/bundle/nsis/*-setup.exe \
            --target "${{ github.sha }}" \
            --title "WinDex ${version} (build ${{ github.run_number }})" \
            --generate-notes \
            --latest
